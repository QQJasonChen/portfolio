<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ Chen — AI Project Lead</title>
<meta name="description" content="How I run AI projects: agents that review each other, AI cost as architecture, measurement on real data. Eleven products shipped solo — three through App Store review.">
<meta property="og:title" content="QQ Chen — AI Project Lead">
<meta property="og:description" content="Eleven AI products shipped solo. How I measure, what I refuse to ship, and how a second AI agent caught my own mistakes.">
<meta property="og:type" content="profile">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.92em' font-size='88'>◆</text></svg>">
<style>
  :root{
    --bg:#08090c; --surface:#101218; --surface-2:#171a21; --line:#1e222c; --line-2:#2b3140;
    --ink:#f7f8fa; --ink-2:#9aa2b3; --ink-3:#636b7e;
    --accent:#ff7a2f; --accent-bg:rgba(255,122,47,.1);
    --ok:#35b869;
    --maxw:1120px; --r:14px;
    --s1:8px; --s2:16px; --s3:28px; --s4:48px; --s5:80px; --s6:120px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#fdfcfa; --surface:#fff; --surface-2:#f5f4f1; --line:#eae7e1; --line-2:#d8d4cc;
      --ink:#0d0f14; --ink-2:#4b5162; --ink-3:#828998;
      --accent:#cf4a13; --accent-bg:rgba(207,74,19,.07); --ok:#1c8347;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  a{color:inherit}
  .rule{height:1px;background:var(--line);margin:0}

  /* ── hero ── */
  .hero{padding:var(--s4) 0 var(--s3)}
  .kicker{display:flex;align-items:center;gap:9px;margin-bottom:16px;
    font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .kicker i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:p 2.4s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
  h1{margin:0 0 16px;font-size:clamp(31px,4.9vw,52px);line-height:1.1;
    letter-spacing:-.034em;font-weight:800;max-width:21ch}
  h1 em{font-style:normal;color:var(--accent)}
  .lede{margin:0 0 22px;max-width:62ch;font-size:15.5px;color:var(--ink-2);line-height:1.62}
  .why{margin:0 0 var(--s4);max-width:60ch;font-size:15px;line-height:1.7;color:var(--ink-3);
    padding-left:16px;border-left:2px solid var(--line-2)}
  .nums{display:flex;flex-wrap:wrap;gap:28px}
  .num b{display:block;font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-.025em;line-height:1.05}
  .num span{font-size:12px;color:var(--ink-3);letter-spacing:.02em}

  /* ── section head ── */
  .sh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 20px}
  .sh h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .sh p{margin:0;font-size:14px;color:var(--ink-3)}
  section.band{padding:44px 0}

  /* ── approach（這頁真正的重點）── */
  .lead-in{max-width:56ch;font-size:clamp(19px,2.6vw,25px);line-height:1.42;
    letter-spacing:-.018em;font-weight:700;margin:0 0 40px}
  .princ{display:grid;gap:0}
  .pr{display:grid;grid-template-columns:64px 1fr;gap:22px;padding:26px 0;border-top:1px solid var(--line)}
  .pr:last-child{border-bottom:1px solid var(--line)}
  .pr .n{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.08em;padding-top:5px}
  .pr h3{margin:0 0 9px;font-size:clamp(17px,2.2vw,20px);font-weight:800;letter-spacing:-.015em;line-height:1.35;max-width:34ch}
  .pr .body{margin:0 0 11px;color:var(--ink-2);font-size:15px;line-height:1.68;max-width:70ch}
  .pf{margin:11px 0 0;font-size:12.5px;color:var(--ink-3)}
  .lnk{background:none;border:none;padding:0;font:inherit;font-weight:700;color:var(--accent);
    cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .pr .ev{margin:0;padding:11px 15px;background:var(--accent-bg);border-left:2px solid var(--accent);
    border-radius:0 8px 8px 0;color:var(--ink);font-size:14.2px;line-height:1.62;max-width:70ch}

  .wk-lede{max-width:66ch;font-size:16px;line-height:1.7;color:var(--ink-2);margin:0 0 30px}
  .wk-foot{margin:18px 0 0;font-size:13px;color:var(--ink-3);font-style:italic}
  .pr .note{margin:11px 0 0;padding-left:14px;border-left:2px solid var(--line-2);
    color:var(--ink-3);font-size:14px;line-height:1.6;max-width:68ch}

  .mini{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .mcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;transition:.18s}
  .mcard:hover{border-color:var(--accent);transform:translateY(-2px)}
  .mshot{aspect-ratio:16/10;background:var(--surface-2);overflow:hidden}
  .mshot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .mb{padding:13px 15px 15px}
  .mb b{display:block;font-size:15px;font-weight:800;letter-spacing:-.012em;margin-bottom:4px}
  .mb span{font-size:13px;color:var(--ink-2);line-height:1.5}
  .mcard:hover .mb b{color:var(--accent)}

  /* ── deep dive ── */
  .cs{display:block;text-decoration:none;color:inherit;margin:0 0 64px;padding:30px 32px;
    border:1px solid var(--line-2);border-radius:16px;background:var(--surface);transition:.18s}
  .cs:hover{border-color:var(--accent);transform:translateY(-2px)}
  .cs .k{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .cs strong{display:block;font-size:clamp(21px,2.9vw,27px);line-height:1.24;
    letter-spacing:-.022em;font-weight:800;margin-bottom:12px;max-width:24ch}
  .cs p{margin:0 0 16px;color:var(--ink-2);font-size:15.5px;line-height:1.66;max-width:66ch}
  .cs .go{font-size:13.5px;font-weight:700;color:var(--accent)}

  /* ── work ── */
  .grid{display:grid;gap:20px;grid-template-columns:1fr}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;
    display:flex;flex-direction:column;transition:.18s}
  .card:hover{border-color:var(--line-2);transform:translateY(-3px)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .shot{position:relative;aspect-ratio:16/10;background:var(--surface-2);overflow:hidden}
  .shot img,.shot video{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .shot .none{position:absolute;inset:0;display:grid;place-content:center;gap:6px;justify-items:center;color:var(--ink-3);font-size:12.5px}
  .pill{position:absolute;top:13px;left:13px;z-index:2;font-size:10.5px;font-weight:800;
    padding:4px 10px;border-radius:999px;background:rgba(6,7,10,.74);color:#fff;backdrop-filter:blur(10px);letter-spacing:.03em}
  .pill.shipped{background:var(--ok)}
  .cb{padding:16px 20px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .cn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .cn h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.022em}
  .cn small{font-size:12px;color:var(--ink-3);font-weight:600}
  .ctag{margin:0;font-size:15px;color:var(--ink-2);font-weight:600;line-height:1.55;max-width:52ch}
  .kv{margin:0;padding:11px 0 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.58}
  .kv b{display:block;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
  .jn{margin:4px 0 0;padding:12px 15px;background:var(--accent-bg);border-radius:10px;
    font-size:13.5px;line-height:1.6;color:var(--ink);max-width:56ch;
    border-left:2px solid var(--accent)}
  .cs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding-top:0}
  .t{font-size:10.5px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);padding:2.5px 8px;border-radius:5px}
  .more{font-size:12.5px;font-weight:700;color:var(--ink-3)}
  .card:hover .more{color:var(--accent)}

  /* ── modal ── */
  dialog{border:none;padding:0;background:transparent;max-width:900px;width:calc(100% - 32px);max-height:90vh;color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.76);backdrop-filter:blur(5px)}
  .sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden auto;max-height:90vh}
  .sheet .media{aspect-ratio:16/9;background:var(--surface-2);position:relative}
  .sheet .media img,.sheet .media video{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .x{position:absolute;top:12px;right:12px;z-index:3;width:34px;height:34px;border-radius:50%;
    border:none;background:rgba(6,7,10,.7);color:#fff;font-size:19px;cursor:pointer;backdrop-filter:blur(10px);line-height:1}
  .sbody{padding:26px 28px 32px}
  .sbody h3{margin:0 0 4px;font-size:27px;font-weight:800;letter-spacing:-.025em}
  .sbody .sub{margin:0 0 16px;color:var(--ink-3);font-size:13.5px;font-weight:600}
  .sbody .tag{margin:0 0 24px;font-size:17px;color:var(--accent);font-weight:700;line-height:1.45;max-width:56ch}
  .blk{margin:0 0 24px}
  .blk h4{margin:0 0 8px;font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
  .blk p{margin:0;color:var(--ink-2);font-size:15.2px;line-height:1.7;max-width:68ch}
  .hl{margin:0;padding:0;list-style:none;display:grid;gap:12px}
  .hl li{position:relative;padding-left:23px;color:var(--ink-2);font-size:14.6px;line-height:1.65;max-width:70ch}
  .hl li::before{content:"→";position:absolute;left:0;color:var(--accent);font-weight:800}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
  .gal img{width:100%;border-radius:9px;border:1px solid var(--line);display:block;cursor:zoom-in}
  .meta{display:flex;flex-wrap:wrap;gap:24px;padding-top:20px;border-top:1px solid var(--line)}
  .meta div{font-size:13.5px;color:var(--ink-2)}
  .meta dt{color:var(--ink-3);font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px}
  .cta{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
  .cta a{text-decoration:none;font-size:14px;font-weight:700;padding:10px 18px;border-radius:10px;border:1px solid var(--line);transition:.15s}
  .cta a:first-child{background:var(--accent);border-color:var(--accent);color:#fff}
  .cta a:hover{border-color:var(--accent);color:var(--accent)}
  .cta a:first-child:hover{opacity:.88;color:#fff}

  footer{border-top:1px solid var(--line);padding:34px 0 70px;color:var(--ink-3);font-size:13px;margin-top:30px}
  footer a{color:var(--ink-2)}
  @media (max-width:640px){
    .hero{padding:62px 0 38px} .nums{gap:22px} section.band{padding:46px 0}
    .pr{grid-template-columns:1fr;gap:10px} .pr .n{padding:0}
    .sbody{padding:20px 18px 26px}
  }

  /* ── 主秀卡：滿版橫式。放在最後，才不會被前面的 .card 直式規則覆蓋 ── */
  /* align-items:start 讓圖保持 16:10 原比例，不被卡片高度拉伸後裁掉字 */
  .card{flex-direction:row;align-items:stretch}
  .card .shot{flex:0 0 46%;aspect-ratio:auto;min-height:100%;border-right:1px solid var(--line)}
  .card .shot img{object-position:center center}
  /* 內容不要比圖高太多，否則裁切會吃掉封面上的字 */
  .cb{padding:24px 28px;justify-content:center;gap:9px}
  .cb{padding:26px 30px;justify-content:center;gap:10px}
  @media (max-width:820px){
    .card{flex-direction:column}
    .card .shot{flex:none;aspect-ratio:16/10;border-right:none;border-bottom:1px solid var(--line)}
    .cb{padding:18px 20px 20px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="kicker"><i></i> Building AI products</div>
    <h1 id="hl"></h1>
    <p class="lede" id="lede"></p>
    <p class="why" id="why"></p>
    <div class="nums" id="nums"></div>
  </header>

  <div class="rule"></div>

  <section class="band">
    <div class="sh"><h2>Pain point → shipped</h2><p>The three with real users behind them</p></div>
    <div class="grid" id="g-ai"></div>
  </section>

  <section class="band" style="padding-top:0">
    <div class="sh"><h2 id="al-k"></h2><p id="al-n"></p></div>
    <div class="mini" id="also"></div>
  </section>

  <div class="rule"></div>

  <section class="band">
  <a class="cs" id="cs" href="casestudy.html">
    <span class="k"></span>
    <strong></strong>
    <p></p>
    <span class="go"></span>
  </a>

  </section>

  <section class="band" style="padding-top:0">
    <div class="sh"><h2>How I run AI projects</h2><p>Three that are hard to put on a CV</p></div>
    
    <div class="princ" id="princ"></div>
  </section>

  <div class="rule"></div>

  <footer>
    <p>QQ Chen · <a id="gh" href="#">GitHub</a></p>
    <p id="ver"></p>
  </footer>
</div>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA = null;

function cover(p) {
  if (p.video) return `<video src="${esc(p.video)}" ${p.cover ? `poster="${esc(p.cover)}"` : ''} autoplay muted loop playsinline preload="metadata"></video>`;
  if (p.cover) return `<img src="${esc(p.cover)}" alt="${esc(p.name)}" loading="lazy">`;
  return `<div class="none"><span style="font-size:24px;opacity:.4">◆</span><span>Screens coming soon</span></div>`;
}

function card(p) {
  return `<button class="card" data-id="${esc(p.id)}">
    <div class="shot"><span class="pill ${p.tier === 'shipped' ? 'shipped' : ''}">${esc(p.status)}</span>${cover(p)}</div>
    <div class="cb">
      <div class="cn"><h3>${esc(p.name)}</h3><small>${esc(p.subtitle)}</small></div>
      <p class="ctag">${esc(p.tagline)}</p>
      ${p.journey ? `<p class="jn">${esc(p.journey)}</p>` : ''}
      <div class="cs">${(p.stack || []).slice(0, 4).map(s => `<span class="t">${esc(s)}</span>`).join('')}</div>
    </div>
  </button>`;
}

function open_(id) {
  const p = DATA.products.find(x => x.id === id); if (!p) return;
  $('#sheet').innerHTML = `
    <div class="media"><button class="x" aria-label="Close">×</button>${cover(p)}</div>
    <div class="sbody">
      <h3>${esc(p.name)}</h3>
      <p class="sub">${esc(p.subtitle)} · ${esc(p.status)}</p>
      <p class="tag">${esc(p.tagline)}</p>
      <section class="blk"><h4>The problem</h4><p>${esc(p.problem)}</p></section>
      <section class="blk"><h4>What it is</h4><p>${esc(p.what)}</p></section>
      <section class="blk"><h4>What was hard</h4><p>${esc(p.hard)}</p></section>
      ${(p.highlights || []).length ? `<section class="blk"><h4>Engineering detail</h4><ul class="hl">${p.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul></section>` : ''}
      ${p.business ? `<section class="blk"><h4>Business model</h4><p>${esc(p.business)}</p></section>` : ''}
      ${(p.gallery || []).length > 1 ? `<section class="blk"><h4>Screens</h4><div class="gal">${p.gallery.map(g => `<img src="${esc(g)}" alt="${esc(p.name)}" loading="lazy" onclick="window.open('${esc(g)}','_blank')">`).join('')}</div></section>` : ''}
      <div class="meta">
        <div><dt>My role</dt>${esc(p.role)}</div>
        <div><dt>Stack</dt>${(p.stack || []).join(' · ')}</div>
        <div><dt>Status</dt>${esc(p.status)}</div>
      </div>
      <div class="cta">${(p.links || []).map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</div>
    </div>`;
  $('#dlg').showModal();
}
$('#dlg').addEventListener('click', e => {
  if (e.target.id === 'dlg' || e.target.classList.contains('x')) $('#dlg').close();
});

fetch('products.json').then(r => r.json()).then(d => {
  DATA = d;
  const o = d.owner || {}, ps = d.products || [];
  $('#hl').innerHTML = esc(o.headline).replace('use AI to ship the thing that fixes it', '<em>use AI to ship the thing that fixes it</em>');
  $('#lede').textContent = o.blurb || '';
  $('#why').textContent = o.why || '';
  $('#gh').href = o.github || '#';

  const n = t => ps.filter(p => p.tier === t).length;
  const stacks = new Set(ps.flatMap(p => p.stack || []));
  $('#nums').innerHTML = [
    [8, 'products shipped solo'],
    [3, 'through App Store review'],
    ['9,858', 'visitors on the exam platform this year'],
    ['2.7', 'pages per visit — they work, not bounce'],
  ].map(([v, l]) => `<div class="num"><b>${v}</b><span>${l}</span></div>`).join('');

  const cs = d.casestudy;
  if (cs) {
    const el = $('#cs');
    el.href = cs.href; el.querySelector('.k').textContent = cs.kicker;
    el.querySelector('strong').textContent = cs.title;
    el.querySelector('p').textContent = cs.blurb;
    el.querySelector('.go').textContent = cs.cta + ' →';
  } else { $('#cs')?.remove(); }

  $('#princ').innerHTML = (d.approach || []).map(a => `<article class="pr">
      <div class="n">${esc(a.n)}</div>
      <div>
        <h3>${esc(a.title)}</h3>
        <p class="body">${esc(a.body)}</p>
        <p class="ev">${esc(a.evidence)}</p>
        ${(a.proof || []).length ? `<p class="pf">Seen in ${a.proof.map(id => {
          const t = (DATA.products.find(x => x.id === id) || {}).name || id;
          return `<button class="lnk" data-id="${esc(id)}">${esc(t)}</button>`;
        }).join(', ')}</p>` : ''}
      </div>
    </article>`).join('');

  $('#g-ai').innerHTML = ps.map(card).join('');

  const al = d.also;
  if (al) {
    $('#al-k').textContent = al.kicker;
    $('#al-n').textContent = al.note;
    $('#also').innerHTML = al.items.map(i =>
      `<a class="mcard" href="${esc(i.href)}" target="_blank" rel="noopener">
         <div class="mshot">${i.cover ? `<img src="${esc(i.cover)}" alt="${esc(i.name)}" loading="lazy">` : ''}</div>
         <div class="mb"><b>${esc(i.name)}</b><span>${esc(i.what)}</span></div>
       </a>`).join('');
  }
  document.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => open_(c.dataset.id)));
  // 判斷 → 證據：原則裡的產品名可以直接開該產品的詳情
  document.querySelectorAll('.lnk').forEach(b =>
    b.addEventListener('click', e => { e.preventDefault(); open_(b.dataset.id); }));

  if (d._verified) $('#ver').textContent =
    'Every product status on this page was verified against a live endpoint or the App Store API on ' + d._verified.split(' ')[0] + '.';
}).catch(e => { $('#g-shipped').innerHTML = '<p style="color:var(--ink-3)">Could not load products.json.</p>'; console.error(e); });
</script>
</body>
</html>
